[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aae-github-copilot"
version = "0.1.0"
description = "Native GitHub Copilot and VS Code adapter for Adaptive Agentic Engineering"
requires-python = ">=3.10"
dependencies = ["adaptive-agentic-engineering>=0.3.1,<0.4"]

[project.scripts]
aae-github-copilot = "aae_github_copilot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aae_github_copilot = [
  "capabilities.json",
  "templates/*",
  "templates/**/*",
  "templates/.github/*",
  "templates/.github/**/*",
]
