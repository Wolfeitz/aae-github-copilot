name: validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install core and adapter
        run: |
          python -m pip install "adaptive-agentic-engineering @ git+https://github.com/Wolfeitz/adaptive-agentic-engineering.git" .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Verify current upstream documentation
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: aae-github-copilot verify-upstream
